<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Trace Phone — Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #05070b;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      width: 92%;
      max-width: 420px;
      background: #0c111a;
      border: 1px solid #1e293b;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 15px 50px rgba(0,0,0,.5);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      color: #cbd5e1;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #334155;
      background: #05070b;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: none;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
    }

    .signup {
      text-align: center;
      margin-top: 20px;
      color: #94a3b8;
      font-size: 14px;
    }

    .signup a {
      color: #60a5fa;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🔐 Trace Phone</h1>

    <div class="subtitle">
      Owner Login
    </div>

    <form id="loginForm">

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button id="loginBtn" type="submit">
        Login
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="signup">
      Don't have an account?
      <a href="signup.html">Create account</a>
    </div>

  </div>


  <script>

    // ==========================================
    // SUPABASE CONFIGURATION
    // ==========================================

    const SUPABASE_URL = "https://iromlvyoogoahfirveow.supabase.co";

    const SUPABASE_ANON_KEY = "sb_publishable_vsmsR6NoKBBbxWq30zgNBA_0Zq_1zeM";


    // ==========================================
    // CREATE SUPABASE CLIENT
    // ==========================================

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    // ==========================================
    // LOGIN
    // ==========================================

    const form = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const message = document.getElementById("message");


    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      message.textContent = "";
      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";


      try {

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });


        if (error) {
          throw error;
        }


        if (!data.session) {
          throw new Error("Login session could not be created.");
        }


        message.style.color = "#4ade80";
        message.textContent = "Login successful.";


        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 700);


      } catch (error) {

        message.style.color = "#f87171";

        message.textContent =
          error.message || "Login failed.";

        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
      }

    });


  </script>

</body>
</html>
