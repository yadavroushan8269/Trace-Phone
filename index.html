<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Trace Phone</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #05070b;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 92%;
      max-width: 420px;
      padding: 30px;
      background: #0c111a;
      border: 1px solid #1e293b;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 15px 50px rgba(0,0,0,.45);
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    p {
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .status {
      margin-top: 18px;
      font-size: 14px;
      color: #64748b;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>📱 Trace Phone</h1>

    <p>
      Secure device recovery dashboard for your registered devices.
    </p>

    <button onclick="location.href='login.html'">
      Login
    </button>

    <div class="status">
      Owner-authorized device recovery
    </div>

  </div>

</body>
</html>
