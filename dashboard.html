<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Trace-Phone Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #05070b;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: #10141c;
      border: 1px solid #293241;
      border-radius: 14px;
      padding: 20px;
      margin-top: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #394454;
      background: #080b10;
      color: white;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: #1677ff;
      color: white;
    }

    .location {
      background: #16a34a;
      color: white;
    }

    .logout {
      background: #dc2626;
      color: white;
    }

    .device {
      background: #080b10;
      border: 1px solid #293241;
      border-radius: 10px;
      padding: 15px;
      margin-top: 15px;
    }

    .status {
      color: #22c55e;
      font-weight: bold;
    }

    .muted {
      color: #9ca3af;
    }

    #message {
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📱 Trace-Phone</h1>

  <div class="card">

    <h2>Register Device</h2>

    <input
      type="text"
      id="deviceName"
      placeholder="Device Name"
    >

    <input
      type="text"
      id="imei"
      placeholder="IMEI Number"
    >

    <button class="primary" onclick="registerDevice()">
      Register Device
    </button>

    <button class="location" onclick="updateLocation()">
      📍 Get Current Location
    </button>

    <button class="logout" onclick="logout()">
      Logout
    </button>

    <div id="message"></div>

  </div>

  <div class="card">

    <h2>My Devices</h2>

    <div id="devices">
      Loading devices...
    </div>

  </div>

</div>


<script>

  /* ==============================
     SUPABASE CONFIG
     ============================== */

  const SUPABASE_URL =
    "https://iromlvyoogoahfirveow.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_vsmsR6NoKBBbxWq30zgNBA_0Zq_1zeM";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  let currentUser = null;


  /* ==============================
     START
     ============================== */

  async function start() {

    const {
      data: { user },
      error
    } = await supabaseClient.auth.getUser();

    if (error || !user) {
      window.location.href = "login.html";
      return;
    }

    currentUser = user;

    loadDevices();
  }


  /* ==============================
     REGISTER DEVICE
     ============================== */

  async function registerDevice() {

    const deviceName =
      document.getElementById("deviceName").value.trim();

    const imei =
      document.getElementById("imei").value.trim();

    const message =
      document.getElementById("message");


    if (!deviceName || !imei) {

      message.innerHTML =
        "Please enter device name and IMEI.";

      return;
    }


    const {
      error
    } = await supabaseClient
      .from("devices")
      .insert({

        user_id: currentUser.id,

        device_name: deviceName,

        imei: imei

      });


    if (error) {

      console.error(error);

      message.innerHTML =
        "Device registration failed.";

      return;
    }


    message.innerHTML =
      "✅ Device registered successfully.";

    document.getElementById("deviceName").value = "";
    document.getElementById("imei").value = "";

    loadDevices();
  }


  /* ==============================
     GET CURRENT LOCATION
     ============================== */

  async function updateLocation() {

    const message =
      document.getElementById("message");


    if (!navigator.geolocation) {

      message.innerHTML =
        "❌ This browser does not support location.";

      return;
    }


    message.innerHTML =
      "📍 Requesting location permission...";


    navigator.geolocation.getCurrentPosition(

      async function(position) {

        const latitude =
          position.coords.latitude;

        const longitude =
          position.coords.longitude;


        /*
          Get user's devices
        */

        const {
          data: devices,
          error: fetchError
        } = await supabaseClient
          .from("devices")
          .select("id")
          .eq("user_id", currentUser.id)
          .order("created_at", {
            ascending: false
          });


        if (fetchError) {

          console.error(fetchError);

          message.innerHTML =
            "❌ Could not find your device.";

          return;
        }


        if (!devices || devices.length === 0) {

          message.innerHTML =
            "❌ First register a device.";

          return;
        }


        /*
          Update latest registered device
        */

        const deviceId =
          devices[0].id;


        const {
          error: updateError
        } = await supabaseClient
          .from("devices")
          .update({

            last_latitude: latitude,

            last_longitude: longitude,

            last_seen: new Date().toISOString()

          })
          .eq("id", deviceId)
          .eq("user_id", currentUser.id);


        if (updateError) {

          console.error(updateError);

          message.innerHTML =
            "❌ Location could not be saved.";

          return;
        }


        message.innerHTML =
          "✅ Location saved successfully.";

        loadDevices();

      },


      function(error) {

        console.error(error);

        if (error.code === 1) {

          message.innerHTML =
            "❌ Location permission denied.";

        } else if (error.code === 2) {

          message.innerHTML =
            "❌ Location unavailable.";

        } else if (error.code === 3) {

          message.innerHTML =
            "❌ Location request timed out.";

        } else {

          message.innerHTML =
            "❌ Unable to get location.";

        }

      },

      {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
      }

    );
  }


  /* ==============================
     LOAD DEVICES
     ============================== */

  async function loadDevices() {

    const container =
      document.getElementById("devices");


    const {
      data,
      error
    } = await supabaseClient
      .from("devices")
      .select("*")
      .eq("user_id", currentUser.id)
      .order("created_at", {
        ascending: false
      });


    if (error) {

      console.error(error);

      container.innerHTML =
        "Unable to load devices.";

      return;
    }


    if (!data || data.length === 0) {

      container.innerHTML =
        '<p class="muted">No devices registered.</p>';

      return;
    }


    container.innerHTML = "";


    data.forEach(device => {

      const locationAvailable =
        device.last_latitude !== null &&
        device.last_longitude !== null;


      const locationText =
        locationAvailable

        ? `${device.last_latitude.toFixed(6)},
           ${device.last_longitude.toFixed(6)}`

        : "Location available nahi hai";


      const lastSeen =
        device.last_seen
        ? new Date(device.last_seen).toLocaleString()
        : "Never";


      const status =
        device.is_lost
        ? "Lost"
        : "Normal";


      const div =
        document.createElement("div");

      div.className = "device";


      div.innerHTML = `

        <h3>${escapeHTML(device.device_name)}</h3>

        <p>
          <b>IMEI:</b>
          ${escapeHTML(device.imei || "Not available")}
        </p>

        <p>
          <b>Status:</b>
          <span class="status">${status}</span>
        </p>

        <p>
          <b>Last Location:</b>
          ${locationText}
        </p>

        <p>
          <b>Last Seen:</b>
          ${lastSeen}
        </p>

      `;


      container.appendChild(div);

    });

  }


  /* ==============================
     LOGOUT
     ============================== */

  async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href = "login.html";
  }


  /* ==============================
     HTML SECURITY
     ============================== */

  function escapeHTML(value) {

    return String(value)

      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* ==============================
     RUN
     ============================== */

  start();

</script>

</body>
</html>
